<!DOCTYPE html> 
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proveedores (API)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
    <i id="theme-icon" class="fas fa-moon text-dark"></i>
  </button>

  <div class="container py-4">
    <h2 class="mb-4 titulo-pagina">Proveedores</h2>
    <div class="stat-cards" id="resumenEstadistico"></div>

    <!-- Botón para mostrar el formulario -->
    <div class="mb-3">
      <button id="toggleFormBtn" class="btn btn-primary">
        <i class="fas fa-plus-circle"></i> Agregar proveedor
      </button>
    </div>

    <!-- Formulario colapsable -->
    <div id="formContainer" style="display: none;">
      <form id="proveedorForm" class="row g-3 mb-4">
        <div class="col-md-6">
          <input type="text" id="empresa" class="form-control" placeholder="Empresa" />
          <div id="empresaError" class="input-error-message d-none">El nombre del proveedor es obligatorio.</div>
        </div>
        <div class="col-md-6"><input type="text" id="direccion" class="form-control" placeholder="Dirección" /></div>
        <div class="col-md-6"><input type="text" id="contacto" class="form-control" placeholder="Contacto" /></div>
        <div class="col-md-6"><input type="email" id="correo" class="form-control" placeholder="Correo" /></div>
        <div class="col-md-6"><input type="text" id="telefono" class="form-control" placeholder="Teléfono" /></div>
        <div class="col-md-6"><input type="text" id="sitio_web" class="form-control" placeholder="Sitio Web" /></div>
        <div class="col-md-6"><input type="text" id="facebook" class="form-control" placeholder="Facebook" /></div>
        <div class="col-md-6"><input type="text" id="instagram" class="form-control" placeholder="Instagram" /></div>
        <div class="col-md-6"><input type="text" id="youtube" class="form-control" placeholder="YouTube" /></div>
        <div class="col-md-6"><input type="text" id="twitter" class="form-control" placeholder="Twitter" /></div>
        <div class="col-md-6"><input type="text" id="linkedin" class="form-control" placeholder="LinkedIn" /></div>
        <div class="col-12"><textarea id="descripcion" class="form-control" placeholder="Descripción"></textarea></div>

        <div class="col-12 d-flex justify-content-end gap-2">
          <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">
            <i class="fas fa-times"></i> Cancelar
          </button>
        </div>
      </form>
    </div>

    <hr class="my-4">

    <div class="mb-4">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-primary text-white">
          <i class="fas fa-search"></i>
        </span>
        <select id="campo" class="form-select" style="max-width: 150px;">
          <option value="empresa">Nombre</option>
          <option value="direccion">Dirección</option>
          <option value="descripcion">Descripción</option>
        </select>
        <input type="text" id="buscar" class="form-control" placeholder="Buscar proveedor...">
        <button class="btn btn-outline-secondary" id="clearSearch" title="Limpiar">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <h3 class="mb-3">Lista de Proveedores</h3>
    <div class="table-responsive scrollable-table">
      <table class="table table-bordered table-striped table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>Empresa</th>
            <th>Dirección</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Sitio Web</th>
            <th>Redes Sociales</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="proveedoresTableBody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
