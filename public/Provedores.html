<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proveedores (API)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Botón de tema -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema" data-bs-toggle="tooltip" title="Cambiar tema">
    <i id="theme-icon" class="fas fa-moon text-dark"></i>
  </button>

  <div class="container py-4">
    <h2 class="mb-4 titulo-pagina">Proveedores</h2>
    <div class="stat-cards" id="resumenEstadistico"></div>

    <!-- Botón para abrir modal -->
    <div class="mb-3">
      <button id="toggleFormBtn" class="btn btn-primary" data-bs-toggle="tooltip" title="Agregar nuevo proveedor">
        <i class="fas fa-plus-circle"></i> Agregar proveedor
      </button>
    </div>

    <hr class="my-4">

    <!-- Buscador -->
    <div class="mb-4">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-primary text-white">
          <i class="fas fa-search"></i>
        </span>
        <select id="campo" class="form-select" style="max-width: 150px;">
          <option value="empresa">Nombre</option>
          <option value="direccion">Dirección</option>
          <option value="descripcion">Descripción</option>
        </select>
        <input type="text" id="buscar" class="form-control" placeholder="Buscar proveedor...">
        <button class="btn btn-outline-secondary" id="clearSearch" data-bs-toggle="tooltip" title="Limpiar búsqueda">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Catálogo de Proveedores</h3>
  <div id="paginationInfo" class="text-muted"></div>
</div>

<div id="proveedoresContainer" class="row g-3 mb-4"></div>

<!-- Paginación -->
<nav aria-label="Navegación de páginas">
  <ul class="pagination justify-content-center" id="paginationControls"></ul>
</nav>

  <!-- Modal del formulario -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formModalLabel">Formulario de Proveedor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="proveedorForm" class="row g-3">
            <div class="col-md-6">
              <input type="text" id="empresa" class="form-control" placeholder="Empresa" />
              <div id="empresaError" class="input-error-message d-none text-danger small">El nombre del proveedor es obligatorio.</div>
            </div>
            <div class="col-md-6"><input type="text" id="direccion" class="form-control" placeholder="Dirección" /></div>
            <div class="col-md-6"><input type="text" id="contacto" class="form-control" placeholder="Contacto" /></div>
            <div class="col-md-6"><input type="email" id="correo" class="form-control" placeholder="Correo" /></div>
            <div class="col-md-6"><input type="text" id="telefono" class="form-control" placeholder="Teléfono" /></div>
            <div class="col-md-6"><input type="text" id="sitio_web" class="form-control" placeholder="Sitio Web" /></div>
            <div class="col-md-6"><input type="text" id="facebook" class="form-control" placeholder="Facebook" /></div>
            <div class="col-md-6"><input type="text" id="instagram" class="form-control" placeholder="Instagram" /></div>
            <div class="col-md-6"><input type="text" id="youtube" class="form-control" placeholder="YouTube" /></div>
            <div class="col-md-6"><input type="text" id="twitter" class="form-control" placeholder="Twitter" /></div>
            <div class="col-md-6"><input type="text" id="linkedin" class="form-control" placeholder="LinkedIn" /></div>
            <div class="col-12"><textarea id="descripcion" class="form-control" placeholder="Descripción"></textarea></div>
            <div class="col-12 d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-success" data-bs-toggle="tooltip" title="Guardar proveedor">
                <i class="fas fa-save"></i> Guardar
              </button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bs-toggle="tooltip" title="Cancelar y cerrar">
                <i class="fas fa-times"></i> Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
